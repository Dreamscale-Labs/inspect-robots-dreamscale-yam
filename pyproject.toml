[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-dreamscale-yam"
version = "0.1.21"
description = "Attended DreamZero-YAM via Dreamscale for a bimanual I2RT YAM rig"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "dreamscale[dreamzero]==0.1.0a26",
  "inspect-robots @ git+https://github.com/robocurve/inspect-robots.git@d748ed9bebf74e660e9daf319475e57d70d10f23",
  "inspect-robots-dreamscale==0.1.18",
  "inspect-robots-yam[collision] @ git+https://github.com/Dreamscale-Labs/inspect-robots-yam.git@95cb6deaa70636cb45864bfbea29226811447c83",
  "numpy>=2.0,<2.5",
  "tomli-w>=1.2,<2",
]

[project.optional-dependencies]
hardware = [
  "i2rt @ git+https://github.com/i2rt-robotics/i2rt.git@ac096928d6899ddf852a71c5e8fbaa6055cd9745",
  'pyrealsense2>=2.50; sys_platform == "linux"',
]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15"]

[project.scripts]
dreamscale-yam = "dreamscale_yam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamscale_yam"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
build-constraint-dependencies = ["scikit-build-core<0.10"]
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["dreamscale.*", "inspect_robots_dreamscale.*", "pyrealsense2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
